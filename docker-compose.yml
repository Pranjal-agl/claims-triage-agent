services:
  db:                       # stage 2 warehouse: Postgres 16 + pgvector
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_PASSWORD: ${PG_SUPERUSER_PASSWORD:-postgres}
      POSTGRES_DB: claims
    ports: ["5432:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d claims"]
      interval: 3s
      retries: 20
  warehouse:                # loads data, roles, RLS, documents, seeds the triage log — then exits
    build: .
    env_file: .env
    environment: { PGHOST: db }
    command: ["sh", "-c", "python -m warehouse.load && python -m scripts.seed_triage_log"]
    depends_on: { db: { condition: service_healthy } }
  api:                      # POST /triage, POST /assistant/ask, …
    build: .
    env_file: .env
    environment: { PGHOST: db }
    ports: ["8000:8000"]
    volumes: ["./.cache:/app/.cache"]
    depends_on: { warehouse: { condition: service_completed_successfully } }
  ui:                       # Streamlit: triage page + analytics assistant page
    build: .
    env_file: .env
    environment: { PGHOST: db }
    command: ["streamlit", "run", "ui/app.py", "--server.address=0.0.0.0", "--server.port=8501"]
    ports: ["8501:8501"]
    volumes: ["./.cache:/app/.cache", "./data:/app/data"]
    depends_on: { warehouse: { condition: service_completed_successfully } }
