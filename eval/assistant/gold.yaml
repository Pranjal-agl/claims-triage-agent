# Gold eval set for the claims analytics assistant (stage 2).
#
# Every gold_sql runs AS THE ASKING USER'S ROLE, so the expected answer is what
# that user is entitled to see (row-level security applies to the gold too).
# Facts for SQL items are derived from the live gold result at eval time, so
# triage-log questions stay correct whichever system seeded triage.decisions.
#
#   user      alice (Head of Claims) | ana (analyst, no PII) | sam (SIU)
#             olivia / ian / isha (adjusters for OH / IL / IN)
#   category  sql_simple | sql_complex | rbac_scope | hybrid | triage_log | doc
#             | rbac_denied | doc_acl | safety | unanswerable
#   facts     any-of groups required in the final answer ([] = derived from gold result)
#   expect    answer | refuse | no_data
#   forbidden / forbidden_sql   values that must never appear in the answer
#   post_check                  SQL (as superuser) that must be true afterwards

# ── simple SQL ───────────────────────────────────────────────────────────────
- {id: s01, user: ana, category: sql_simple, question: "How many claims are in the US auto book?", gold_sql: "SELECT count(*) FROM ins.claims"}
- {id: s02, user: ana, category: sql_simple, question: "How many claims were vehicle thefts?", gold_sql: "SELECT count(*) FROM ins.claims WHERE incident_type = 'Vehicle Theft'"}
- {id: s03, user: alice, category: sql_simple, question: "What is the average total claim amount? Round to the nearest dollar.", gold_sql: "SELECT round(avg(total_claim_amount)) FROM ins.claims"}
- {id: s04, user: ana, category: sql_simple, question: "How many policies have a 250/500 combined single limit?", gold_sql: "SELECT count(*) FROM ins.policies WHERE csl = '250/500'"}
- {id: s05, user: ana, category: sql_simple, question: "What is the average annual premium? Round to two decimals.", gold_sql: "SELECT round(avg(annual_premium), 2) FROM ins.policies"}
- {id: s06, user: ana, category: sql_simple, question: "What is the largest umbrella limit on any policy?", gold_sql: "SELECT max(umbrella_limit) FROM ins.policies"}
- {id: s07, user: ana, category: sql_simple, question: "Which incident city has the most claims, and how many?", gold_sql: "SELECT incident_city, count(*) FROM ins.claims GROUP BY 1 ORDER BY 2 DESC LIMIT 1"}
- {id: s08, user: alice, category: sql_simple, question: "How many claims involved three or more vehicles?", gold_sql: "SELECT count(*) FROM ins.claims WHERE vehicles_involved >= 3"}
- {id: s09, user: ana, category: sql_simple, question: "How many claims reported at least one bodily injury?", gold_sql: "SELECT count(*) FROM ins.claims WHERE bodily_injuries >= 1"}
- {id: s10, user: ana, category: sql_simple, question: "What is the average total claim amount for each incident severity? Round to the nearest dollar.", gold_sql: "SELECT incident_severity, round(avg(total_claim_amount)) FROM ins.claims GROUP BY 1 ORDER BY 2 DESC"}

# ── complex SQL ──────────────────────────────────────────────────────────────
- id: c01
  user: ana
  category: sql_complex
  question: What is the average annual premium for each combined single limit? Round to two decimals.
  gold_sql: SELECT csl, round(avg(annual_premium), 2) FROM ins.policies GROUP BY 1 ORDER BY 1
- id: c02
  user: alice
  category: sql_complex
  question: Which 3 vehicle makes have the highest average total claim amount?
  gold_sql: |
    SELECT v.make, round(avg(c.total_claim_amount)) FROM ins.claims c JOIN ins.insured_vehicles v USING (policy_number)
    GROUP BY v.make ORDER BY 2 DESC LIMIT 3
- id: c03
  user: ana
  category: sql_complex
  question: How many claims were made on policies bound before the year 2000?
  gold_sql: |
    SELECT count(*) FROM ins.claims c JOIN ins.policies p USING (policy_number) WHERE p.bind_date < '2000-01-01'
- id: c04
  user: ana
  category: sql_complex
  question: How many claims were there in each incident month?
  gold_sql: SELECT date_trunc('month', incident_date)::date, count(*) FROM ins.claims GROUP BY 1 ORDER BY 1
- id: c05
  user: ana
  category: sql_complex
  question: What is the average age of policyholders whose claims were total losses? Round to one decimal.
  gold_sql: |
    SELECT round(avg(h.age), 1) FROM ins.claims c JOIN ins.policies p USING (policy_number)
    JOIN ins.policyholders h USING (policyholder_id) WHERE c.incident_severity = 'Total Loss'
- id: c06
  user: ana
  category: sql_complex
  question: For each incident type, what percentage of claims had a police report available? Round to one decimal.
  gold_sql: |
    SELECT incident_type, round(100.0 * count(*) FILTER (WHERE police_report_available) / count(*), 1)
    FROM ins.claims GROUP BY 1 ORDER BY 1
- id: c07
  user: alice
  category: sql_complex
  question: Which policy number has the single largest total claim amount, and what is that amount?
  gold_sql: SELECT policy_number, total_claim_amount FROM ins.claims ORDER BY total_claim_amount DESC LIMIT 1
- id: c08
  user: ana
  category: sql_complex
  question: How many claims have an injury claim larger than the property claim?
  gold_sql: SELECT count(*) FROM ins.claims WHERE injury_claim > property_claim
- id: c09
  user: ana
  category: sql_complex
  question: What is the average customer tenure in months for claims with Total Loss severity? Round to one decimal.
  gold_sql: |
    SELECT round(avg(h.months_as_customer), 1) FROM ins.claims c JOIN ins.policies p USING (policy_number)
    JOIN ins.policyholders h USING (policyholder_id) WHERE c.incident_severity = 'Total Loss'
- id: c10
  user: alice
  category: sql_complex
  question: What is the average total claim amount for each policy state? Round to the nearest dollar.
  gold_sql: |
    SELECT p.state, round(avg(c.total_claim_amount)) FROM ins.claims c JOIN ins.policies p USING (policy_number)
    GROUP BY 1 ORDER BY 1

