# ── hybrid: documented definition + SQL ─────────────────────────────────────
- {id: h01, user: ana, category: hybrid, question: "How many large-loss claims are there?", gold_sql: "SELECT count(*) FROM ins.claims WHERE total_claim_amount >= 60000", gold_docs: [kpi_definitions]}
- {id: h02, user: olivia, category: hybrid, question: "How many large-loss claims are there in my region?", gold_sql: "SELECT count(*) FROM ins.claims WHERE total_claim_amount >= 60000", gold_docs: [kpi_definitions]}
- id: h03
  user: ana
  category: hybrid
  question: What is the fraud rate for each region? Round to one decimal.
  gold_sql: |
    SELECT p.state, round(100.0 * avg(c.fraud_reported::int), 1) FROM ins.claims c JOIN ins.policies p USING (policy_number)
    GROUP BY 1 ORDER BY 1
  gold_docs: [kpi_definitions]
- id: h04
  user: ana
  category: hybrid
  question: How many Ohio claims are there?
  gold_sql: "SELECT count(*) FROM ins.claims c JOIN ins.policies p USING (policy_number) WHERE p.state = 'OH'"
  gold_docs: [kpi_definitions]
  note: Region = policy state (352). Filtering on incident_state = 'OH' gives 23.
- id: h05
  user: olivia
  category: hybrid
  question: How many claims in my region exceed a regional adjuster's settlement authority?
  gold_sql: SELECT count(*) FROM ins.claims WHERE total_claim_amount > 25000
  gold_docs: [claims_handling_manual]
- id: h06
  user: ana
  category: hybrid
  question: What percentage of claims are documented? Round to one decimal.
  gold_sql: SELECT round(100.0 * count(*) FILTER (WHERE police_report_available) / count(*), 1) FROM ins.claims
  gold_docs: [kpi_definitions]
- id: h07
  user: ana
  category: hybrid
  question: What is the fraud rate for documented claims versus undocumented claims? Round to one decimal.
  gold_sql: |
    SELECT coalesce(police_report_available, false) AS documented, round(100.0 * avg(fraud_reported::int), 1)
    FROM ins.claims GROUP BY 1 ORDER BY 1
  gold_docs: [kpi_definitions]
- {id: h08, user: ana, category: hybrid, question: "What is the injury share across the whole book? Round to one decimal.", gold_sql: "SELECT round(100.0 * sum(injury_claim) / sum(total_claim_amount), 1) FROM ins.claims", gold_docs: [kpi_definitions]}
- {id: h09, user: ana, category: hybrid, question: "How many serious claims are there?", gold_sql: "SELECT count(*) FROM ins.claims WHERE incident_severity IN ('Major Damage', 'Total Loss')", gold_docs: [kpi_definitions]}
- id: h10
  user: sam
  category: hybrid
  question: Under the theft rule in the claims handling manual, how many theft claims had to be referred to SIU?
  gold_sql: "SELECT count(*) FROM ins.claims WHERE incident_type = 'Vehicle Theft' AND police_report_available IS NOT TRUE"
  gold_docs: [claims_handling_manual]
- id: h11
  user: ana
  category: hybrid
  question: What was the triage agent's auto-decision rate across the logged decisions? Round to one decimal.
  gold_sql: "SELECT round(100.0 * count(*) FILTER (WHERE decision <> 'ESCALATED') / count(*), 1) FROM triage.decisions"
  gold_docs: [kpi_definitions]
- {id: h12, user: sam, category: hybrid, question: "How many night-time incidents had zero witnesses?", gold_sql: "SELECT count(*) FROM ins.claims WHERE incident_hour BETWEEN 0 AND 5 AND witnesses = 0", gold_docs: [kpi_definitions]}

